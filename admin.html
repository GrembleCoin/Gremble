<!-- STATS -->

<div class="stats-grid">

    <article class="stat-card">
        <span>TOTAL MEMBERS</span>

        <strong id="statTotalMembers">
            0
        </strong>

        <small>
            REGISTERED MEMBERS
        </small>
    </article>


    <article class="stat-card">
        <span>COMPLETE PROFILES</span>

        <strong id="statCompletedProfiles">
            0
        </strong>

        <small>
            X + SOLANA
        </small>
    </article>


    <article class="stat-card">
        <span>IN TELEGRAM</span>

        <strong id="statTelegramChatMembers">
            0
        </strong>

        <small>
            GREMBLE CHAT
        </small>
    </article>


    <article class="stat-card">
        <span>IN TELEGRAM</span>

        <strong id="statTelegramAnnouncementsMembers">
            0
        </strong>

        <small>
            GREMBLE ANNOUNCEMENTS
        </small>
    </article>

</div>


<!-- MEMBERS -->

<section class="members-panel">

    <div class="members-panel-top">

        <div class="members-panel-title">

            <span>
                GREMBLE MEMBERS
            </span>

            <h2>
                Registered people
            </h2>

        </div>


        <div class="members-tools">

            <input
                type="search"
                class="member-search"
                id="memberSearch"
                placeholder="Search Telegram, X, wallet or group status..."
                autocomplete="off"
            >

            <button
                type="button"
                class="refresh-button"
                id="refreshMembers"
            >
                REFRESH
            </button>

        </div>

    </div>


    <div class="members-table-wrap">

        <table class="members-table">

            <thead>

                <tr>

                    <th>
                        TELEGRAM NAME
                    </th>

                    <th>
                        TELEGRAM USERNAME
                    </th>

                    <th>
                        GREMBLE CHAT
                    </th>

                    <th>
                        GREMBLE ANNOUNCEMENTS
                    </th>

                    <th>
                        X USERNAME
                    </th>

                    <th>
                        SOLANA ADDRESS
                    </th>

                    <th>
                        JOINED
                    </th>

                    <th>
                        UPDATED
                    </th>

                </tr>

            </thead>


            <tbody id="membersTableBody">
            </tbody>

        </table>


        <div
            class="members-empty"
            id="membersEmpty"
            hidden
        >
            NO MEMBERS FOUND.
        </div>

    </div>

</section>
